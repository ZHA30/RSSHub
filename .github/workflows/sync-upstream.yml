name: Sync upstream

on:
    workflow_dispatch:
        inputs:
            dry-run:
                description: 'Run rebase without pushing changes'
                required: true
                default: true
                type: boolean

permissions:
    contents: write

concurrency:
    group: sync-upstream-${{ github.ref }}
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository_owner != 'DIYgod'
        runs-on: ubuntu-latest
        name: Rebase fork on upstream
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  ref: master

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Fetch upstream
              run: |
                  git remote add upstream https://github.com/DIYgod/RSSHub.git
                  git fetch --no-tags upstream master

            - name: Show divergence
              run: |
                  echo "Local HEAD: $(git rev-parse HEAD)"
                  echo "Upstream HEAD: $(git rev-parse upstream/master)"
                  git rev-list --left-right --count HEAD...upstream/master

            - name: Rebase on upstream
              run: git rebase upstream/master

            - name: Push rebased master
              if: ${{ !inputs['dry-run'] }}
              run: git push --force-with-lease origin HEAD:master

            - name: Dry-run summary
              if: ${{ inputs['dry-run'] }}
              run: |
                  echo "Dry run completed. Rebased HEAD would be pushed to origin/master:"
                  git log --oneline --decorate --max-count=10
