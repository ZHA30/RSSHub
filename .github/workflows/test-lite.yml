name: Test Lite

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths:
            - 'lib/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/test-lite.yml'
    pull_request:
        paths:
            - 'lib/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/test-lite.yml'
    workflow_dispatch: {}

permissions:
    checks: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        name: Build on Node LTS
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: lts/*
                  cache: 'pnpm'
            - name: Install dependencies (pnpm)
              run: pnpm i
            - name: Rebuild dependencies
              run: pnpm rb
            - name: Build routes
              run: pnpm build

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            redis:
                image: redis
                ports:
                    - 6379/tcp
                options: --entrypoint redis-server
        name: Test on Node LTS
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: lts/*
                  cache: 'pnpm'
            - name: Install dependencies (pnpm)
              run: pnpm i
            - name: Rebuild dependencies
              run: pnpm rb
            - name: Install bundled Chromium
              run: pnpm exec patchright install chromium
            - name: Build route metadata
              run: pnpm build:routes
            - name: Test all and generate coverage
              run: pnpm run vitest:coverage --reporter=github-actions
              env:
                  REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/
