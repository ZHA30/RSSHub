name: Release image

on:
    push:
        branches: [master]
        paths:
            - '.github/workflows/image.yml'
            - 'Dockerfile'
            - '.dockerignore'
            - 'lib/**'
            - '!lib/**/*.test.*'
            - '!lib/**/*.spec.*'
            - '!lib/**/__tests__/**'
            - 'scripts/docker/**'
            - 'scripts/workflow/build-routes.ts'
            - 'scripts/workflow/check-orphan-files.ts'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'patches/**'
            - 'tsconfig.json'
            - 'tsdown.config.ts'

permissions:
    contents: read
    packages: write

concurrency:
    group: image-publish
    cancel-in-progress: true

jobs:
    build:
        name: ${{ matrix.pair }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      pair: linux-amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      pair: linux-arm64
                      runner: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
            - name: Set image name
              run: echo "IMAGE=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
            - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push latest
              id: latest
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: ${{ matrix.platform }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                  build-args: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
                  cache-from: type=gha,scope=router-latest-${{ matrix.pair }}
                  cache-to: type=gha,mode=max,scope=router-latest-${{ matrix.pair }}
                  outputs: type=image,name=${{ env.IMAGE }},compression=zstd,force-compression=true,push-by-digest=true,name-canonical=true,push=true
            - name: Save latest digest
              run: |
                  mkdir -p "$RUNNER_TEMP/digests/latest"
                  digest="${{ steps.latest.outputs.digest }}"
                  touch "$RUNNER_TEMP/digests/latest/${digest#sha256:}"
            - name: Upload latest digest
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: digests-latest-${{ matrix.pair }}
                  path: ${{ runner.temp }}/digests/latest/*
                  if-no-files-found: error
                  retention-days: 1
            - name: Build and push chromium-bundled
              id: chromium
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: ${{ matrix.platform }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                  build-args: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
                  cache-from: |
                      type=registry,ref=${{ env.IMAGE }}:chromium-bundled
                      type=gha,scope=router-latest-${{ matrix.pair }}
                  cache-to: type=inline
                  outputs: type=image,name=${{ env.IMAGE }},compression=zstd,force-compression=true,push-by-digest=true,name-canonical=true,push=true
            - name: Save chromium-bundled digest
              run: |
                  mkdir -p "$RUNNER_TEMP/digests/chromium-bundled"
                  digest="${{ steps.chromium.outputs.digest }}"
                  touch "$RUNNER_TEMP/digests/chromium-bundled/${digest#sha256:}"
            - name: Upload chromium-bundled digest
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: digests-chromium-bundled-${{ matrix.pair }}
                  path: ${{ runner.temp }}/digests/chromium-bundled/*
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Publish manifests
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Set image name
              run: echo "IMAGE=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
            - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Download latest digests
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: ${{ runner.temp }}/digests/latest
                  pattern: digests-latest-*
                  merge-multiple: true
            - name: Publish latest manifest
              working-directory: ${{ runner.temp }}/digests/latest
              run: |
                  digests=()
                  for digest in *; do digests+=("$IMAGE@sha256:$digest"); done
                  docker buildx imagetools create --tag "$IMAGE:latest" "${digests[@]}"
            - name: Download chromium-bundled digests
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: ${{ runner.temp }}/digests/chromium-bundled
                  pattern: digests-chromium-bundled-*
                  merge-multiple: true
            - name: Publish chromium-bundled manifest
              working-directory: ${{ runner.temp }}/digests/chromium-bundled
              run: |
                  digests=()
                  for digest in *; do digests+=("$IMAGE@sha256:$digest"); done
                  docker buildx imagetools create --tag "$IMAGE:chromium-bundled" "${digests[@]}"
